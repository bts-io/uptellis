<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Monitors · Uptellis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main" data-action="skip">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#monitors" aria-label="Uptellis, go to monitors">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M7 17h4l3-7 4 13 3-6h4" fill="none" stroke="var(--brand-ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-name">Uptellis</span>
      </a>
      <span class="site-name" id="site-name">Acme Cloud</span>
      <nav class="tabs" aria-label="Main">
        <a href="#monitors" data-tab="monitors">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          <span>Monitors</span><span class="tab-badge" id="down-badge" hidden></span>
        </a>
        <a href="#status-page" data-tab="status-page">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h6M7 16h10"/></svg>
          <span>Status page</span>
        </a>
        <a href="#alerts" data-tab="alerts">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span>Alerts</span>
        </a>
        <a href="#settings" data-tab="settings">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>
      <div class="user">
        <button class="user-btn" type="button" id="user-btn" aria-haspopup="true" aria-expanded="false" aria-controls="user-menu">
          <span class="avatar" aria-hidden="true">SR</span><span class="sr-only">Account menu for Sam Rivera</span>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <p class="user-who"><strong>Sam Rivera</strong><span>Owner</span></p>
          <a href="#settings">Account and team</a>
          <a href="#first-run">Show the welcome screen</a>
          <button type="button" data-action="toast" data-msg="Signed out (not really, this is a mock-up)">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2 id="drawer-title">Drawer</h2>
        <button type="button" class="icon-btn" data-action="close-drawer">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          <span class="sr-only">Close</span>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
      <div class="drawer-foot" id="drawer-foot"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../data/demo.js"></script>
  <script src="app.js"></script>
</body>
</html>

# Releases and container images on the GitHub mirror. Releases are cut on Forgejo (the source of truth):
# a maintainer bumps the version and CHANGELOG.md in a release PR, fast-forwards staging to main and pushes a
# signed vX.Y.Z tag; the mirror then brings the tag here.
# - Tag vX.Y.Z (or vX.Y.Z-rc.N): publish the GitHub release with that version's CHANGELOG.md section, and build
#   the image for it. A tag with a pre-release suffix is published as a pre-release and never becomes `latest`.
# - Push to staging: build the `staging` image.
# Images are multi-arch (amd64, arm64), pushed to GHCR with an SBOM and provenance attestation, and signed
# with cosign (keyless, GitHub OIDC). The image job is a no-op until the repository has a root Dockerfile.
# The agent (agent/) gets the same image, ghcr.io/bts-io/uptellis-agent, and on a tag its two binaries
# (uptellis-agent-linux-amd64 and -arm64, with SHA256SUMS) are attached to the release.
name: Release

on:
  push:
    branches: [staging]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/bts-io/uptellis
  AGENT_IMAGE: ghcr.io/bts-io/uptellis-agent

jobs:
  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The section under "## <version>" up to the next "## " heading.
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag $pre

  agent-binaries:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      # The agent bundles src/shared (zod from the root install) and src/checks.
      - run: bun install --frozen-lockfile
      - run: bun run agent:install
      - name: Build the binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pair in x64:amd64 arm64:arm64; do
            bun build agent/src/main.ts --compile --minify --sourcemap --target="bun-linux-${pair%%:*}" \
              --define "AGENT_VERSION=\"${TAG#v}\"" --outfile "dist/uptellis-agent-linux-${pair##*:}"
          done
          ./dist/uptellis-agent-linux-amd64 --version
          (cd dist && sha256sum uptellis-agent-linux-* > SHA256SUMS)
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/uptellis-agent-linux-amd64 dist/uptellis-agent-linux-arm64 dist/SHA256SUMS

  dockerfile:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "present=${{ hashFiles('Dockerfile') != '' }}" >> "$GITHUB_OUTPUT"

  image:
    needs: [dockerfile]
    if: needs.dockerfile.outputs.present == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Resolve what to build
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            latest=true
            case "$REF_NAME" in *-*) latest=false ;; esac
            { echo "ref=$REF_NAME"; echo "version=$REF_NAME"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"
          else
            { echo "ref=$GITHUB_SHA"; echo "version="; echo "latest=false"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # X.Y.Z, X.Y and X for a release (pre-releases get only their full version), `latest` for a stable
          # release, `staging` for a push to staging.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.target.outputs.latest == 'true' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  agent-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Resolve what to build
        id: target
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            latest=true
            case "$REF_NAME" in *-*) latest=false ;; esac
            { echo "ref=$REF_NAME"; echo "version=$REF_NAME"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"
          else
            { echo "ref=$GITHUB_SHA"; echo "version="; echo "latest=false"; } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AGENT_IMAGE }}
          flavor: latest=false
          # X.Y.Z, X.Y and X for a release (pre-releases get only their full version), `latest` for a stable
          # release, `staging` for a push to staging.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.target.outputs.latest == 'true' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          build-args: VERSION=${{ steps.target.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$AGENT_IMAGE@$DIGEST"

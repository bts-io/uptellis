# Releases and container images.
# - Push to main: release-please opens or updates the release PR (version bump in package.json, CHANGELOG.md).
#   Merging that PR tags vX.Y.Z and publishes the GitHub release; the image job then builds that version.
# - A release published by hand (for example a vX.Y.Z-rc.N pre-release from staging) builds that tag.
# - Push to staging: builds the `staging` image.
# Images are multi-arch (amd64, arm64), pushed to GHCR with an SBOM and provenance attestation, and signed
# with cosign (keyless, GitHub OIDC). The image job is a no-op until the repository has a root Dockerfile.
name: Release

on:
  push:
    branches: [main, staging]
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/bts-io/uptellis

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dockerfile:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "present=${{ hashFiles('Dockerfile') != '' }}" >> "$GITHUB_OUTPUT"

  image:
    needs: [release-please, dockerfile]
    # release-please is skipped outside main, so this job decides on its own inputs instead of needing success.
    if: >-
      !cancelled() && needs.dockerfile.outputs.present == 'true' && (
        github.event_name == 'release' ||
        github.ref == 'refs/heads/staging' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Resolve what to build
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$EVENT" = release ]; then
            ref="$RELEASE_TAG" version="$RELEASE_TAG" latest=$([ "$PRERELEASE" = true ] && echo false || echo true)
          elif [ -n "$PLEASE_TAG" ]; then
            ref="$PLEASE_TAG" version="$PLEASE_TAG" latest=true
          else
            ref="$GITHUB_SHA" version="" latest=false
          fi
          { echo "ref=$ref"; echo "version=$version"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # X.Y.Z, X.Y and X for a release (pre-releases get only their full version), `latest` for a stable
          # release, `staging` for a push to staging.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.target.outputs.version }},enable=${{ steps.target.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.target.outputs.latest == 'true' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"


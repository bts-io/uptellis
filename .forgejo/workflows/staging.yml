# Deploys `staging` to the maintainers' staging Worker on every push, so the Cloudflare path is tested live on
# every merge. The resource ids and URL come from repository variables (STAGING_D1_ID, STAGING_KV_ID,
# STAGING_PUBLIC_URL) and the Cloudflare credentials from organization settings; none of them are in the repo.
# The job is skipped where those variables are not set (forks, other installs).
name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.STAGING_D1_ID != ''
    runs-on: docker
    container:
      image: node:22-bookworm
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_NAME: uptellis-staging
      DEPLOY_D1_NAME: uptellis-staging-db
      DEPLOY_D1_ID: ${{ vars.STAGING_D1_ID }}
      DEPLOY_KV_ID: ${{ vars.STAGING_KV_ID }}
      DEPLOY_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run deploy:config
      - name: Deploy (migrations, build, deploy)
        run: |
          subject=$(git log -1 --format=%s | tr -d "'" | cut -c1-60)
          bun run deploy -- --tag "${GITHUB_SHA:0:12}" --message "staging ${{ github.run_number }}: $subject"
      - name: Smoke check
        run: |
          for i in $(seq 1 24); do
            body=$(curl -fsS "$DEPLOY_PUBLIC_URL/api/health" || true)
            case "$body" in *'"commit":"'"${GITHUB_SHA:0:12}"'"'*) echo "live: $body"; exit 0 ;; esac
            sleep 5
          done
          echo "staging did not report ${GITHUB_SHA:0:12}: $body" >&2; exit 1

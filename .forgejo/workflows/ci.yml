# Lint, typecheck and test on every push and pull request to main and staging, lint the commit messages
# (and the PR title) against Conventional Commits, and scan the tree for private names with the leak check.
# The job container is node:22-bookworm rather than oven/bun: checkout is a JavaScript action and needs node
# inside the container, and workerd needs glibc. Bun is installed on top.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: docker
    container:
      image: node:22-bookworm
    timeout-minutes: 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          # Full history, so commitlint can walk the commits of the push or the PR.
          fetch-depth: 0
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          # Same Bun that wrote bun.lock, so --frozen-lockfile agrees with it.
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      # The collector and the agent have their own lockfiles; their typechecks (in `check`) and bun tests (in
      # `verify`) need them.
      - run: bun run collector:install
      - run: bun run agent:install

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint --verbose
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: >-
          bunx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch has an all-zero "before"; its commits are linted in the PR that brings them in.
          if [ -z "${BEFORE//0/}" ]; then exit 0; fi
          bunx commitlint --verbose --from "$BEFORE" --to "$GITHUB_SHA"

      - name: Leak check
        env:
          # The secret holds the denylist, one case-insensitive regex per line. It is not handed to pull
          # requests from forks, and the check skips when it is empty.
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: bun run leak-check

      - name: Verify (biome ci, check, test)
        run: bun run verify
